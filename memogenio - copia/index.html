<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memogenios</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PANTALLA DE BIENVENIDA -->
  <div id="screen-welcome" class="screen active">
    <div class="welcome-card">
      <h1 class="title">🧠 Memogenios</h1>
      <p class="subtitle">¿Creés que tenés buena memoria?</p>
      <p class="description">
        Encontrá todos los pares antes de quedarte sin intentos
        y demostrales a todos que sos un verdadero genio.
      </p>
      <button id="btn-start" class="btn btn-primary">Comenzar desafío</button>
    </div>
  </div>

  <!-- PANTALLA DE JUEGO -->
  <div id="screen-game" class="screen">
    <div class="game-wrapper">
      <h1 class="game-title">🧠 Memogenios</h1>
      <div class="stats">
        <div class="stat-box">
          <span class="stat-label">Intentos restantes</span>
          <span id="attempts-count" class="stat-value">10</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Pares encontrados</span>
          <span id="pairs-count" class="stat-value">0 / 6</span>
        </div>
      </div>
      <div id="card-grid" class="card-grid"></div>
    </div>
  </div>

  <!-- PANTALLA FINAL -->
  <div id="screen-end" class="screen">
    <div class="end-card">
      <h1 id="end-title" class="title"></h1>
      <p id="end-text" class="description"></p>
      <button id="btn-finish" class="btn btn-primary">Finalizar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
